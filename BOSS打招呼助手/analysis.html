<!doctype html>
<html lang="zh-CN">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>识别记录｜BOSS打招呼助手</title>
    <link rel="stylesheet" href="analysis.css">
  </head>
  <body>
    <main class="records-shell">
      <header class="records-hero">
        <p class="records-kicker">BOSS打招呼助手｜AI 岗位筛选</p>

        <div class="records-panel__heading">
          <span>岗位分析</span>
          <small id="records-count">载入中…</small>

        <div id="records-list" class="records-list"></div>
      </section>
    </main>
