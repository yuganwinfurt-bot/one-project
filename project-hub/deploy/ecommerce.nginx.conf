# include 到 www.yuganwinfurt.top 的 HTTPS server { ... } 内。
# 不要单独放到 sites-enabled；不要覆盖现有 /agent/、/rag/ 和 / 路由。
location = /ecommerce {
    return 301 /ecommerce/;
}

location ^~ /ecommerce/api/ {
    proxy_pass http://127.0.0.1:8001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    client_max_body_size 100m;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

# 数据库中的商品图、头像和评价图片沿用 /uploads/ 地址。
location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /ecommerce/ {
    alias /home/ubuntu/one-project/customer-service-system/customer-service-system/frontend/dist/index.html;
    add_header Cache-Control "no-cache";
}

location = /ecommerce/index.html {
    alias /home/ubuntu/one-project/customer-service-system/customer-service-system/frontend/dist/index.html;
    add_header Cache-Control "no-cache";
}

location ^~ /ecommerce/ {
    root /home/ubuntu/one-project/customer-service-system/customer-service-system/frontend/dist;
    rewrite ^/ecommerce/(.*)$ /$1 break;
    try_files $uri /ecommerce/index.html;
}
